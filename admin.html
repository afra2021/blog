<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - Real Blog</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 25px; }
        .user-badge { background: #262626; padding: 5px 12px; border-radius: 20px; color: #00adb5; }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .btn-logout { background: #cf6679; color: black; }
        .form-box { background: #1e1e1e; padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #2d2d2d; border: 1px solid #3f3f3f; color: white; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
        .btn-submit { background: #00adb5; color: white; width: 100%; font-size: 1.1rem; margin-top: 15px; }
        .ql-toolbar { background: #2d2d2d; border-radius: 8px 8px 0 0; direction: ltr; border-color: #3f3f3f !important; }
        .ql-container { background: #252525; border-radius: 0 0 8px 8px; color: white; border-color: #3f3f3f !important; min-height: 250px; }
        .ql-editor { direction: rtl; text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2 style="margin:0;">پنل انتشار</h2>
            <div>
                <span id="user-display" class="user-badge">...</span>
                <a href="index.html" style="color:#00adb5; text-decoration:none; margin: 0 15px;">Real Blog</a>
                <button class="btn btn-logout" onclick="logout()">خروج</button>
            </div>
        </header>

        <div class="form-box">
            <h3 id="form-title">نوشتن پست جدید</h3>
            <input type="hidden" id="edit-id">
            
            <input type="text" id="post-title" placeholder="عنوان پست...">
            
            <select id="post-category" onchange="toggleCustomCategory()">
                <option value="">یک دسته‌بندی انتخاب کنید...</option>
                <option value="تکنولوژی">تکنولوژی</option>
                <option value="برنامه‌نویسی">برنامه‌نویسی</option>
                <option value="روزمره">روزمره</option>
                <option value="آموزشی">آموزشی</option>
                <option value="custom">سفارشی (نوشتن دسته‌بندی جدید)...</option>
            </select>
            <input type="text" id="custom-category" placeholder="نام دسته‌بندی خود را بنویسید..." style="display:none;">

            <div id="editor-container"></div>
            <button class="btn btn-submit" id="submit-btn" onclick="savePost()">انتشار پست</button>
        </div>
    </div>

    <script>
        const _supabase = window.supabase.createClient('https://zvajqmlqulgyqlffjbze.supabase.co', 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO');
        const quill = new Quill('#editor-container', { theme: 'snow', placeholder: 'متن پست...', modules: { toolbar: [['bold', 'italic'], [{'color':[]}], ['link', 'image', 'clean']] }});
        let currentUser = null; let currentUsername = '';

        function toggleCustomCategory() {
            const select = document.getElementById('post-category');
            const customInput = document.getElementById('custom-category');
            customInput.style.display = select.value === 'custom' ? 'block' : 'none';
        }

        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            currentUser = session.user;
            currentUsername = currentUser.user_metadata?.username || 'ناشناس';
            document.getElementById('user-display').innerText = `نویسنده: ${currentUsername}`;
        }

        async function savePost() {
            const title = document.getElementById('post-title').value.trim();
            const content = quill.root.innerHTML.trim();
            const selectCat = document.getElementById('post-category').value;
            const customCat = document.getElementById('custom-category').value.trim();
            
            const finalCategory = selectCat === 'custom' ? customCat : selectCat;

            if (!title) return alert('عنوان الزامی است.');
            document.getElementById('submit-btn').disabled = true;

            const { error } = await _supabase.from('posts').insert([{ 
                title, content, category: finalCategory, user_id: currentUser.id, author_name: currentUsername, author_email: currentUser.email 
            }]);

            if (error) alert('خطا: ' + error.message);
            else window.location.href = 'index.html';
            document.getElementById('submit-btn').disabled = false;
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }
        checkAuth();
    </script>
</body>
</html>
