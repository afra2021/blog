<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل انتشار - Real Blog</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e; --border-color: #333; --accent-color: #00adb5; }
        [data-theme="light"] { --bg-color: #f4f4f9; --text-color: #333333; --card-bg: #ffffff; --border-color: #ddd; --accent-color: #007c82; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 20px; transition: 0.4s; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .header-actions { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        
        .user-badge { display: flex; align-items: center; gap: 10px; background: var(--border-color); padding: 6px 15px; border-radius: 20px; color: var(--accent-color); font-size: 0.9rem; font-weight: bold; }
        .user-badge img { width: 25px; height: 25px; border-radius: 50%; background: #222; object-fit: cover; }
        
        .btn { padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-logout { background: #cf6679; color: black; }
        .theme-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: 0.3s; padding: 0; margin-right: 10px; }
        
        .form-box { background: var(--card-bg); padding: 30px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        
        .profile-box { background: rgba(0, 173, 181, 0.05); padding: 20px; border-radius: 10px; border: 1px dashed var(--accent-color); display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .profile-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .profile-row label { min-width: 130px; font-weight: bold; font-size: 0.95rem; }
        .profile-box input[type="text"] { margin: 0; padding: 10px; flex: 1; min-width: 200px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; font-family: inherit; }
        .profile-box input[type="file"] { margin: 0; padding: 8px; flex: 1; min-width: 200px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; font-family: inherit; cursor: pointer; }
        .btn-save-name { background: var(--accent-color); color: white; padding: 10px 20px; align-self: flex-start; }

        .stats-dashboard { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-box { background: var(--card-bg); flex: 1; min-width: 180px; padding: 25px 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .stat-box:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .stat-box h4 { margin: 0 0 15px 0; color: var(--text-color); opacity: 0.8; font-size: 1.1rem; }
        .stat-box span { font-size: 2.5rem; font-weight: 900; color: var(--accent-color); display: block; }

        input, select { width: 100%; padding: 14px; margin-bottom: 18px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-family: inherit; box-sizing: border-box; font-size: 1rem; }
        input::placeholder { color: #888; }
        .btn-submit { background: var(--accent-color); color: white; width: 100%; font-size: 1.1rem; padding: 12px; margin-top: 20px; }
        
        .ql-toolbar { background: var(--bg-color); border-radius: 8px 8px 0 0; direction: ltr; border-color: var(--border-color) !important; }
        .ql-container { background: var(--bg-color); border-radius: 0 0 8px 8px; border-color: var(--border-color) !important; min-height: 250px; }
        .ql-editor { direction: rtl; text-align: right; color: var(--text-color); font-size: 1.05rem; line-height: 1.8; }
        .ql-editor img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2 style="margin:0; color: var(--accent-color);">پنل مدیریت</h2>
            <div class="header-actions">
                <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
                <span id="user-display" class="user-badge">...</span>
                <a href="index.html" style="color: var(--accent-color); text-decoration:none; font-weight: bold;">← بازگشت به سایت</a>
                <button class="btn btn-logout" onclick="logout()">خروج</button>
            </div>
        </header>

        <div class="profile-box">
            <div class="profile-row">
                <label>نام نمایشی:</label>
                <input type="text" id="display-name-input" placeholder="نامی که کاربران می‌بینند...">
            </div>
            <div class="profile-row">
                <label>آپلود عکس پروفایل:</label>
                <input type="file" id="avatar-file-input" accept="image/png, image/jpeg, image/jpg, image/gif">
            </div>
            <button class="btn btn-save-name" id="save-name-btn" onclick="updateProfile()">ذخیره تنظیمات پروفایل</button>
        </div>

        <div id="admin-stats-dashboard" class="stats-dashboard" style="display: none;">
            <div class="stat-box">
                <h4>📝 کل مطالب سایت</h4>
                <span id="stat-posts">...</span>
            </div>
            <div class="stat-box">
                <h4>💬 کل نظرات سایت</h4>
                <span id="stat-comments">...</span>
            </div>
            <div class="stat-box">
                <h4>❤️ مجموع لایک‌ها</h4>
                <span id="stat-likes">...</span>
            </div>
        </div>

        <div class="form-box">
            <h3 id="form-title" style="margin-top: 0;">نوشتن پست جدید</h3>
            
            <input type="text" id="post-title" placeholder="عنوان پست خود را بنویسید...">
            
            <select id="post-category" onchange="toggleCustomCategory()">
                <option value="">یک دسته‌بندی انتخاب کنید...</option>
                <option value="تکنولوژی">تکنولوژی</option>
                <option value="برنامه‌نویسی">برنامه‌نویسی</option>
                <option value="روزمره">روزمره</option>
                <option value="آموزشی">آموزشی</option>
                <option value="custom">سفارشی (نوشتن دسته‌بندی جدید)...</option>
            </select>
            <input type="text" id="custom-category" placeholder="نام دسته‌بندی خود را بنویسید..." style="display:none;">

            <div id="editor-container"></div>
            <button class="btn btn-submit" id="submit-btn" onclick="savePost()">انتشار پست</button>
        </div>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-btn');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeBtn.innerText = savedTheme === 'dark' ? '☀️' : '🌙';

        function toggleTheme() {
            const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeBtn.innerText = newTheme === 'dark' ? '☀️' : '🌙';
        }

        const _supabase = window.supabase.createClient('https://zvajqmlqulgyqlffjbze.supabase.co', 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO');
        
        // سیستم هندلینگ هوشمند آپلود تصویر در ادیتور
        const quill = new Quill('#editor-container', { 
            theme: 'snow', 
            placeholder: 'متن پست...', 
            modules: { 
                toolbar: {
                    container: [['bold', 'italic'], [{'color':[]}], ['link', 'image', 'clean']],
                    handlers: { image: imageHandler }
                }
            }
        });

        function imageHandler() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = async () => {
                const file = input.files[0];
                if (file) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
                    
                    const range = quill.getSelection(true);
                    quill.insertText(range.index, '... در حال آپلود تصویر در سرور ...', { color: '#00adb5' });

                    const { data, error } = await _supabase.storage.from('post_images').upload(fileName, file, { cacheControl: '3600' });
                    
                    quill.deleteText(range.index, 33); // حذف متن انتظار

                    if (error) {
                        alert('خطا در آپلود تصویر: ' + error.message);
                    } else {
                        const { data: { publicUrl } } = _supabase.storage.from('post_images').getPublicUrl(fileName);
                        quill.insertEmbed(range.index, 'image', publicUrl);
                    }
                }
            };
        }
        
        let currentUser = null; 
        let currentUsername = '';
        let currentAvatar = '';
        const ADMIN_EMAIL = 'behnamafra1387@gmail.com';

        const urlParams = new URLSearchParams(window.location.search);
        const editPostId = urlParams.get('edit');

        function toggleCustomCategory() {
            const select = document.getElementById('post-category');
            const customInput = document.getElementById('custom-category');
            customInput.style.display = select.value === 'custom' ? 'block' : 'none';
        }

        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            
            currentUser = session.user;
            
            currentUsername = currentUser.user_metadata?.display_name || currentUser.user_metadata?.username;
            if (!currentUsername) {
                currentUsername = currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'مدیر سایت' : currentUser.email.split('@')[0];
            }
            
            currentAvatar = currentUser.user_metadata?.avatar_url || '';
            const displayAvatar = currentAvatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUsername}`;
            
            document.getElementById('user-display').innerHTML = `<img src="${displayAvatar}" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${currentUsername}'"> نویسنده: ${currentUsername}`;
            document.getElementById('display-name-input').value = currentUsername;

            if (currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById('admin-stats-dashboard').style.display = 'flex';
                loadAdminStats();
            }

            if (editPostId) {
                loadPostForEdit();
            }
        }

        async function loadAdminStats() {
            const { data: posts, count: postsCount } = await _supabase.from('posts').select('likes', { count: 'exact' });
            let totalLikes = 0;
            if (posts) totalLikes = posts.reduce((sum, post) => sum + (post.likes || 0), 0);
            const { count: commentsCount } = await _supabase.from('comments').select('*', { count: 'exact', head: true });

            document.getElementById('stat-posts').innerText = postsCount || 0;
            document.getElementById('stat-comments').innerText = commentsCount || 0;
            document.getElementById('stat-likes').innerText = totalLikes;
        }

        async function loadPostForEdit() {
            document.getElementById('submit-btn').innerText = 'در حال دریافت اطلاعات پست...';
            document.getElementById('submit-btn').disabled = true;

            const { data, error } = await _supabase.from('posts').select('*').eq('id', editPostId).single();
            if (error || !data) return window.location.href = 'admin.html';

            if (currentUser.id !== data.user_id && currentUser.email !== ADMIN_EMAIL) {
                alert('شما اجازه ویرایش این مطلب را ندارید.');
                return window.location.href = 'index.html';
            }

            document.getElementById('form-title').innerText = 'ویرایش پست ✏️';
            document.getElementById('post-title').value = data.title;
            
            const catSelect = document.getElementById('post-category');
            const options = Array.from(catSelect.options).map(o => o.value);
            if (options.includes(data.category)) {
                catSelect.value = data.category;
            } else if(data.category) {
                catSelect.value = 'custom';
                document.getElementById('custom-category').style.display = 'block';
                document.getElementById('custom-category').value = data.category;
            }
            
            quill.root.innerHTML = data.content;
            document.getElementById('submit-btn').innerText = 'بروزرسانی مطلب';
            document.getElementById('submit-btn').disabled = false;
        }

        async function updateProfile() {
            const newName = document.getElementById('display-name-input').value.trim();
            const avatarFile = document.getElementById('avatar-file-input').files[0];
            
            if (!newName) return alert('نام نمایشی نمی‌تواند خالی باشد.');
            const btn = document.getElementById('save-name-btn');
            btn.innerText = 'در حال آپلود و بروزرسانی...';
            btn.disabled = true;

            let newAvatarUrl = currentAvatar;

            if (avatarFile) {
                const fileExt = avatarFile.name.split('.').pop();
                const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
                const { data: uploadData, error: uploadError } = await _supabase.storage.from('avatars').upload(fileName, avatarFile, { cacheControl: '3600', upsert: true });

                if (uploadError) {
                    alert('خطا در آپلود عکس: ' + uploadError.message);
                    btn.innerText = 'ذخیره تنظیمات پروفایل';
                    btn.disabled = false;
                    return;
                }
                const { data: { publicUrl } } = _supabase.storage.from('avatars').getPublicUrl(fileName);
                newAvatarUrl = publicUrl;
            }

            const { error } = await _supabase.auth.updateUser({ data: { display_name: newName, avatar_url: newAvatarUrl } });
            if (error) { alert('خطا در ذخیره: ' + error.message); btn.disabled = false; return; }

            await _supabase.from('posts').update({ author_name: newName, avatar_url: newAvatarUrl }).eq('user_id', currentUser.id);
            await _supabase.from('comments').update({ author_name: newName, avatar_url: newAvatarUrl }).eq('author_name', currentUsername);

            alert('پروفایل شما با موفقیت ذخیره شد!');
            document.getElementById('avatar-file-input').value = '';
            btn.innerText = 'ذخیره تنظیمات پروفایل';
            btn.disabled = false;
            currentUsername = newName; currentAvatar = newAvatarUrl;
            document.getElementById('user-display').innerHTML = `<img src="${currentAvatar}" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${currentUsername}'"> نویسنده: ${currentUsername}`;
        }

        async function savePost() {
            const title = document.getElementById('post-title').value.trim();
            const content = quill.root.innerHTML.trim();
            const selectCat = document.getElementById('post-category').value;
            const customCat = document.getElementById('custom-category').value.trim();
            const finalCategory = selectCat === 'custom' ? customCat : selectCat;

            if (!title) return alert('عنوان پست الزامی است.');
            document.getElementById('submit-btn').disabled = true;

            if (editPostId) {
                const { error } = await _supabase.from('posts').update({ title, content, category: finalCategory }).eq('id', editPostId);
                if (error) { alert('خطا در ویرایش: ' + error.message); document.getElementById('submit-btn').disabled = false; } 
                else { window.location.href = `post.html?id=${editPostId}`; }
            } else {
                const { error } = await _supabase.from('posts').insert([{ 
                    title, content, category: finalCategory, user_id: currentUser.id, 
                    author_name: currentUsername, author_email: currentUser.email, avatar_url: currentAvatar 
                }]);
                if (error) { alert('خطا در انتشار: ' + error.message); document.getElementById('submit-btn').disabled = false; } 
                else { window.location.href = 'index.html'; }
            }
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }
        checkAuth();
    </script>
</body>
</html>
