<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پنل مدیریت - Real Blog</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e1e1e'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dominant-baseline='central' font-family='sans-serif' font-weight='900' font-size='20' fill='%2300adb5'%3ER%3C/text%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e; --border-color: #333; --accent-color: #00adb5; }
        [data-theme="light"] { --bg-color: #f4f4f9; --text-color: #333333; --card-bg: #ffffff; --border-color: #ddd; --accent-color: #007c82; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; margin: 0; transition: 0.4s; -webkit-tap-highlight-color: transparent; }
        
        svg.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
        
        header { background-color: var(--bg-color); padding: 15px 30px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.4s; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-title { font-size: 1.6rem; font-weight: 900; color: var(--text-color); text-decoration: none; font-family: sans-serif;}
        .header-title span { color: var(--accent-color); }
        .actions { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        
        .auth-box { display: flex; align-items: center; gap: 8px; background: var(--card-bg); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border-color); font-size: 0.85rem; font-weight: bold; }
        .auth-avatar { width: 28px; height: 28px; border-radius: 50%; background: #333; object-fit: cover; }
        
        .theme-toggle { background: none; border: none; cursor: pointer; transition: 0.3s; padding: 0; color: var(--text-color); }
        .theme-toggle:hover { transform: rotate(20deg) scale(1.15); color: var(--accent-color); }
        .admin-btn { background: linear-gradient(45deg, #555, #333); color: white; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: all 0.3s ease; border: none; cursor: pointer; font-family: inherit;}
        
        .main-layout { display: flex; gap: 30px; max-width: 1150px; margin: 30px auto; padding: 0 20px; align-items: flex-start; }
        .editor-section { width: 62%; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .sidebar-section { width: 38%; display: flex; flex-direction: column; gap: 25px; }
        .panel-box { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }
        
        h3 { margin-top: 0; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; color: var(--accent-color); font-size: 1.1rem; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 1rem; box-sizing: border-box; }
        
        .toolbar { display: flex; gap: 6px; background: rgba(0, 173, 181, 0.1); padding: 10px; border-radius: 8px 8px 0 0; border: 1px solid var(--border-color); border-bottom: none; flex-wrap: wrap; align-items: center; }
        .toolbar button, .toolbar label { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 0.85rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; margin: 0; }
        .toolbar button:hover, .toolbar label:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .toolbar input[type="file"] { display: none; }
        
        .rich-editor { width: 100%; min-height: 320px; padding: 15px; border-radius: 0 0 8px 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 1.05rem; box-sizing: border-box; line-height: 1.8; margin-bottom: 15px; overflow-y: auto; outline: none; }
        .rich-editor:focus { border-color: var(--accent-color); }
        .rich-editor img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
        
        button.btn-primary { background: var(--accent-color); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; width: 100%; font-size: 1.1rem; transition: 0.3s; }
        button.btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        
        .avatar-upload-area { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; background: var(--bg-color); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .avatar-preview { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-color); background: #333; flex-shrink: 0; }
        .avatar-btn { background: var(--card-bg); color: var(--text-color); border: 1px dashed var(--accent-color); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; font-family: inherit; transition: 0.2s; display: inline-block; }
        .avatar-btn:hover { background: var(--accent-color); color: white; border-style: solid; }

        .post-item { background: var(--bg-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: 0.3s; }
        .post-item:hover { border-color: var(--accent-color); transform: translateX(-5px); }
        .post-item.is-hidden { border: 1px dashed #ff4c4c; opacity: 0.75; }
        .post-item h4 { margin: 0 0 5px 0; font-size: 0.95rem; color: var(--text-color); }
        .post-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-small { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 0.75rem; color: white; }
        .btn-edit { background: var(--accent-color); }
        .btn-delete { background: #ff4c4c; }
        .btn-hide { background: #f39c12; }

        #toast-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast { background: var(--card-bg); color: var(--text-color); padding: 12px 20px; border-radius: 8px; border-right: 4px solid var(--accent-color); box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-family: inherit; font-size: 0.9rem; opacity: 0; transform: translateX(-50px); transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; align-items: center; gap: 10px; }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.error { border-right-color: #ff4c4c; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-box { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--border-color); text-align: center; transform: scale(0.9); transition: 0.3s; }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-msg { margin: 0 0 20px 0; font-size: 1.1rem; line-height: 1.6; }
        .modal-actions { display: flex; justify-content: center; gap: 10px; }

        @media (max-width: 768px) {
            header { padding: 12px 15px; flex-direction: column; align-items: stretch; }
            .header-left, .actions { justify-content: space-between; width: 100%; }
            .main-layout { flex-direction: column; padding: 0 10px; }
            .editor-section, .sidebar-section { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <p class="modal-msg" id="modal-msg">آیا مطمئن هستید؟</p>
            <div class="modal-actions">
                <button id="modal-yes" class="btn-small btn-delete">بله، مطمئنم</button>
                <button id="modal-no" class="btn-small" style="background:#555;">لغو</button>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>

    <header>
        <div class="header-left">
            <a href="index.html" class="header-title">Real <span>Blog</span></a>
        </div>
        <div class="actions">
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
                <svg class="icon" style="width:22px; height:22px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <div id="auth-status"></div>
            <button onclick="logout()" class="admin-btn">خروج</button>
            <a href="index.html" class="admin-btn" style="background: var(--accent-color);">مشاهده سایت</a>
        </div>
    </header>

    <div class="main-layout" id="app-content" style="display: none;">
        
        <div class="editor-section">
            <h3 id="editor-title">نوشتن مطلب جدید</h3>
            
            <input type="text" id="post-title" placeholder="عنوان مطلب را اینجا بنویسید...">
            
            <input type="text" id="post-category" list="categories" placeholder="دسته‌بندی (انتخاب کنید یا تایپ کنید)">
            <datalist id="categories">
                <option value="تکنولوژی">
                <option value="روزمره">
                <option value="آموزشی">
                <option value="دلنوشته">
                <option value="داستان">
            </datalist>
            
            <div class="toolbar">
                <button type="button" onclick="formatText('bold')" title="ضخیم"><b>B</b></button>
                <button type="button" onclick="formatText('italic')" title="کج"><i>I</i></button>
                <button type="button" onclick="formatText('underline')" title="زیرخط"><u>U</u></button>
                <button type="button" onclick="formatText('formatBlock', 'H2')" title="تیتر بزرگ">تیتر بزرگ</button>
                <button type="button" onclick="insertLink()" title="افزودن لینک">🔗 لینک</button>
                
                <label for="post-inline-image" title="افزودن عکس در متن (بهینه سازی خودکار حجم)" style="margin-right: auto;">
                    📷 افزودن عکس
                </label>
                <input type="file" id="post-inline-image" accept="image/*" onchange="uploadImageToEditor(this)">
            </div>
            
            <div id="post-content" class="rich-editor" contenteditable="true"></div>

            <button class="btn-primary" onclick="savePost()" id="submit-btn">انتشار مطلب</button>
        </div>

        <div class="sidebar-section">
            <div class="panel-box">
                <h3>پروفایل نویسنده</h3>
                <input type="text" id="prof-name" placeholder="نام نمایشی شما">
                
                <div class="avatar-upload-area">
                    <img id="avatar-preview" class="avatar-preview" src="" alt="آواتار">
                    <div>
                        <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="uploadAvatarFile(this)">
                        <label for="avatar-file-input" class="avatar-btn">انتخاب و آپلود عکس آواتار</label>
                    </div>
                </div>

                <button class="btn-primary" id="prof-btn" style="font-size:0.95rem; padding:10px;" onclick="updateProfile()">ذخیره پروفایل</button>
            </div>

            <div class="panel-box">
                <h3 id="posts-list-title">مطالب من</h3>
                <div id="my-posts-list">در حال دریافت...</div>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            const icon = isError ? `<svg class="icon" style="stroke:#ff4c4c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>` : `<svg class="icon" style="stroke:var(--accent-color)" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        function showConfirm(message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-modal');
                document.getElementById('modal-msg').innerText = message;
                modal.classList.add('show');
                document.getElementById('modal-yes').onclick = function() { modal.classList.remove('show'); resolve(true); };
                document.getElementById('modal-no').onclick = function() { modal.classList.remove('show'); resolve(false); };
            });
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        function toggleTheme() {
            const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('post-content').focus();
        }
        function insertLink() {
            const url = prompt("آدرس لینک (URL) را وارد کنید:", "https://");
            if (url) formatText('createLink', url);
        }

        // موتور فشرده‌سازی خودکار تصاویر به فرمت WebP قبل از آپلود
        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                // عدم دستکاری فایل‌های GIF برای حفظ انیمیشن
                if (file.type === 'image/gif') return resolve({ blob: file, ext: 'gif' });

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) resolve({ blob: blob, ext: 'webp' });
                            else resolve({ blob: file, ext: file.name.split('.').pop() });
                        }, 'image/webp', quality);
                    };
                    img.onerror = () => resolve({ blob: file, ext: file.name.split('.').pop() });
                };
                reader.onerror = () => resolve({ blob: file, ext: file.name.split('.').pop() });
            });
        }

        const _supabase = window.supabase.createClient('https://zvajqmlqulgyqlffjbze.supabase.co', 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO');
        
        let currentUser = null;
        let isAdmin = false;
        let editingPostId = null;
        let uploadedAvatarUrl = '';

        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                currentUser = session.user;
                if (currentUser.user_metadata?.is_admin === true) {
                    isAdmin = true;
                    document.getElementById('posts-list-title').innerText = 'مدیریت کل مطالب سایت (ادمین)';
                }
                document.getElementById('app-content').style.display = 'flex';
                updateHeaderAuthUI();
                loadProfileSettings();
                loadMyPosts();
                checkEditMode();
            }
        }

        function updateHeaderAuthUI() {
            const authDiv = document.getElementById('auth-status');
            let name = currentUser.user_metadata?.display_name || currentUser.user_metadata?.username || 'کاربر';
            let avatar = currentUser.user_metadata?.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`;
            authDiv.innerHTML = `<div class="auth-box"><img src="${avatar}" class="auth-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${name}'"> <span>${escapeHtml(name)}</span></div>`;
        }

        function loadProfileSettings() {
            let name = currentUser.user_metadata?.display_name || currentUser.user_metadata?.username || '';
            uploadedAvatarUrl = currentUser.user_metadata?.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${name || 'user'}`;
            document.getElementById('prof-name').value = name;
            document.getElementById('avatar-preview').src = uploadedAvatarUrl;
        }

        async function uploadAvatarFile(input) {
            const file = input.files[0];
            if (!file) return;

            showToast('در حال بهینه‌سازی و آپلود آواتار...');
            const { blob, ext } = await compressImage(file, 300, 0.85);
            const fileName = `avatar_${Date.now()}.${ext}`;
            const filePath = `${currentUser.id}/${fileName}`;

            const { error: uploadError } = await _supabase.storage.from('avatars').upload(filePath, blob, {
                contentType: ext === 'webp' ? 'image/webp' : file.type
            });
            
            if (uploadError) {
                showToast('خطا در آپلود آواتار: ' + uploadError.message, true);
            } else {
                const { data } = _supabase.storage.from('avatars').getPublicUrl(filePath);
                uploadedAvatarUrl = data.publicUrl;
                document.getElementById('avatar-preview').src = uploadedAvatarUrl;
                showToast('آواتار با حجم بهینه آپلود شد! روی "ذخیره پروفایل" کلیک کنید.');
            }
        }

        async function updateProfile() {
            const newName = document.getElementById('prof-name').value.trim();
            const btn = document.getElementById('prof-btn');
            
            if(!newName) return showToast('نام نمایشی نمی‌تواند خالی باشد!', true);
            
            btn.innerText = 'در حال ذخیره...';
            
            const { data, error } = await _supabase.auth.updateUser({
                data: { display_name: newName, avatar_url: uploadedAvatarUrl }
            });

            if (error) {
                showToast('خطا در بروزرسانی پروفایل', true);
            } else {
                await _supabase.from('posts').update({
                    author_name: newName,
                    avatar_url: uploadedAvatarUrl
                }).eq('user_id', currentUser.id);

                showToast('پروفایل و مطالب قبلی با موفقیت بروزرسانی شدند!');
                currentUser = data.user;
                updateHeaderAuthUI();
                loadMyPosts();
            }
            btn.innerText = 'ذخیره پروفایل';
        }

        async function uploadImageToEditor(input) {
            const file = input.files[0];
            if (!file) return;

            showToast('در حال فشرده‌سازی و آپلود تصویر...');
            const { blob, ext } = await compressImage(file, 1200, 0.82);
            const fileName = `post_${Date.now()}.${ext}`;
            const filePath = `${currentUser.id}/${fileName}`;

            const { error: uploadError } = await _supabase.storage.from('post_images').upload(filePath, blob, {
                contentType: ext === 'webp' ? 'image/webp' : file.type
            });

            if (uploadError) {
                showToast('خطا در آپلود تصویر: ' + uploadError.message, true);
            } else {
                const { data } = _supabase.storage.from('post_images').getPublicUrl(filePath);
                const imgTag = `<img src="${data.publicUrl}" alt="تصویر مطلب" loading="lazy"><br>`;
                
                document.getElementById('post-content').focus();
                document.execCommand('insertHTML', false, imgTag);
                
                showToast('عکس با حجم بهینه در متن درج شد.');
                input.value = ''; 
            }
        }

        async function loadMyPosts() {
            let query = _supabase.from('posts').select('*').order('created_at', { ascending: false });
            if (!isAdmin) {
                query = query.eq('user_id', currentUser.id);
            }

            const { data: posts, error } = await query;
            const listDiv = document.getElementById('my-posts-list');
            
            if (error) return listDiv.innerText = 'خطا در بارگذاری مطالب.';
            if (!posts || posts.length === 0) return listDiv.innerHTML = '<p style="color:#888;">شما هنوز مطلبی منتشر نکرده‌اید.</p>';

            listDiv.innerHTML = '';
            posts.forEach(post => {
                const date = new Date(post.created_at).toLocaleDateString('fa-IR');
                const hiddenStatus = post.is_hidden ? '<span style="color:#ff4c4c; font-weight:bold;">(مخفی)</span>' : '';
                const hideBtn = isAdmin ? `<button class="btn-small btn-hide" style="background:${post.is_hidden ? '#2ecc71' : '#f39c12'};" onclick="toggleHideFromList('${post.id}', ${Boolean(post.is_hidden)})" title="${post.is_hidden ? 'نمایش عمومی' : 'مخفی کردن'}">${post.is_hidden ? '👁️' : '👁️‍🗨️'}</button>` : '';

                listDiv.innerHTML += `
                    <div class="post-item ${post.is_hidden ? 'is-hidden' : ''}">
                        <div>
                            <h4>${escapeHtml(post.title)} ${hiddenStatus}</h4>
                            <span style="font-size:0.75rem; color:#888;">✍️ ${escapeHtml(post.author_name || 'ناشناس')} | 📅 ${date}</span>
                        </div>
                        <div class="post-item-actions">
                            ${hideBtn}
                            <button class="btn-small btn-edit" onclick="window.location.href='admin.html?edit=${post.id}'" title="ویرایش">✏️</button>
                            <button class="btn-small btn-delete" onclick="deletePost('${post.id}')" title="حذف">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        async function toggleHideFromList(id, currentHiddenState) {
            if (!isAdmin) return;
            const { error } = await _supabase.from('posts').update({ is_hidden: !currentHiddenState }).eq('id', id);
            if (!error) {
                showToast(!currentHiddenState ? 'مطلب مخفی شد.' : 'مطلب عمومی شد.');
                loadMyPosts();
            } else {
                showToast('خطا در تغییر وضعیت', true);
            }
        }

        function checkEditMode() {
            const urlParams = new URLSearchParams(window.location.search);
            editingPostId = urlParams.get('edit');
            if (editingPostId) {
                document.getElementById('editor-title').innerText = '✏️ ویرایش مطلب';
                document.getElementById('submit-btn').innerText = 'ذخیره تغییرات';
                loadPostForEdit(editingPostId);
            }
        }

        async function loadPostForEdit(id) {
            const { data, error } = await _supabase.from('posts').select('*').eq('id', id).single();
            if (data) {
                document.getElementById('post-title').value = data.title;
                document.getElementById('post-category').value = data.category || '';
                document.getElementById('post-content').innerHTML = sanitizeRichHtml(data.content);
            } else {
                showToast('خطا در لود مطلب', true);
            }
        }


        function sanitizeRichHtml(html) {
            const template = document.createElement('template');
            template.innerHTML = html || '';
            const allowedTags = new Set(['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI', 'A', 'IMG', 'BLOCKQUOTE']);
            const safeUrl = (value) => {
                try {
                    const url = new URL(value, window.location.origin);
                    return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
                } catch { return ''; }
            };
            template.content.querySelectorAll('*').forEach((element) => {
                const original = Object.fromEntries([...element.attributes].map((attribute) => [attribute.name, attribute.value]));
                if (!allowedTags.has(element.tagName)) {
                    element.replaceWith(document.createTextNode(element.textContent || ''));
                    return;
                }
                [...element.attributes].forEach((attribute) => element.removeAttribute(attribute.name));
                if (element.tagName === 'A') {
                    const href = safeUrl(original.href || '');
                    if (href) {
                        element.setAttribute('href', href);
                        element.setAttribute('target', '_blank');
                        element.setAttribute('rel', 'noopener noreferrer');
                    }
                }
                if (element.tagName === 'IMG') {
                    const src = safeUrl(original.src || '');
                    if (src) element.setAttribute('src', src);
                    else element.remove();
                    if (original.alt) element.setAttribute('alt', original.alt.slice(0, 200));
                }
            });
            return template.innerHTML;
        }

        async function savePost() {
            const title = document.getElementById('post-title').value.trim();
            const category = document.getElementById('post-category').value.trim();
            const content = sanitizeRichHtml(document.getElementById('post-content').innerHTML.trim());
            const btn = document.getElementById('submit-btn');

            if (!title || !content || content === '<br>') return showToast('لطفاً عنوان و متن مطلب را وارد کنید.', true);

            btn.disabled = true; btn.innerText = 'در حال ذخیره...';

            let authorName = currentUser.user_metadata?.display_name || currentUser.user_metadata?.username || 'ناشناس';
            const authorAvatar = currentUser.user_metadata?.avatar_url || '';

            let error;
            if (editingPostId) {
                const { error: updateErr } = await _supabase.from('posts').update({
                    title: title, content: content, category: category
                }).eq('id', editingPostId);
                error = updateErr;
            } else {
                const { error: insertErr } = await _supabase.from('posts').insert([{
                    title: title, content: content, category: category,
                    user_id: currentUser.id,
                    author_name: authorName, avatar_url: authorAvatar, is_hidden: false
                }]);
                error = insertErr;
            }

            if (error) {
                showToast('خطا در ذخیره مطلب: ' + error.message, true);
                btn.disabled = false; btn.innerText = editingPostId ? 'ذخیره تغییرات' : 'انتشار مطلب';
            } else {
                showToast(editingPostId ? 'تغییرات با موفقیت ذخیره شد!' : 'مطلب شما منتشر شد!');
                setTimeout(() => window.location.href = 'index.html', 1500);
            }
        }

        async function deletePost(id) {
            if(await showConfirm('آیا از حذف این مطلب مطمئن هستید؟')) {
                const { error } = await _supabase.from('posts').delete().eq('id', id);
                if (!error) {
                    showToast('مطلب با موفقیت حذف شد.');
                    loadMyPosts();
                } else {
                    showToast('خطا در حذف مطلب', true);
                }
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }
        
        function escapeHtml(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ''; }

        checkAuth();
    </script>
</body>
