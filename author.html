<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پروفایل نویسنده - Real Blog</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e; --border-color: #333; --accent-color: #00adb5; }
        [data-theme="light"] { --bg-color: #f4f4f9; --text-color: #333333; --card-bg: #ffffff; --border-color: #ddd; --accent-color: #007c82; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; margin: 0; transition: 0.4s ease; -webkit-tap-highlight-color: transparent; }
        
        header { background-color: var(--bg-color); padding: 15px 30px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.4s; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-title { font-size: 1.6rem; font-weight: 900; color: var(--text-color); text-decoration: none; }
        .header-title span { color: var(--accent-color); }
        .theme-toggle { background: none; border: none; cursor: pointer; transition: 0.3s; padding: 0; color: var(--text-color); }
        .theme-toggle:hover { transform: rotate(20deg) scale(1.15); color: var(--accent-color); }

        .main-layout { display: block; max-width: 850px; margin: 40px auto; padding: 0 20px; }
        
        .profile-header { background: var(--card-bg); padding: 30px; border-radius: 12px; text-align: center; border: 1px solid var(--border-color); margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 15px; background: #222; }
        .profile-name { font-size: 1.8rem; margin: 0 0 10px 0; color: var(--accent-color); }
        .profile-stats { color: #888; font-size: 0.95rem; display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        
        svg.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
        .icon-heart { stroke: #ff4c4c; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .post-card { background: var(--card-bg); border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border-color); opacity: 0; animation: fadeInUp 0.4s ease forwards; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; overflow: hidden; }
        .post-card:hover { transform: translateY(-4px); border-color: var(--accent-color); box-shadow: 0 8px 25px rgba(0, 173, 181, 0.12); }
        .post-cover { width: 100%; height: 240px; object-fit: cover; border-bottom: 1px solid var(--border-color); display: block; }
        .post-card-body { padding: 25px; cursor: pointer; }
        
        .category-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; background: rgba(0, 173, 181, 0.1); color: var(--accent-color); margin-bottom: 12px; border: 1px solid rgba(0, 173, 181, 0.2); }
        .post-title { margin: 0 0 15px 0; font-size: 1.5rem; color: var(--text-color); line-height: 1.4; }
        
        .post-meta { font-size: 0.85rem; color: #888; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border-bottom: 1px dashed var(--border-color); padding-bottom: 15px; }
        .stat-icons { display: flex; gap: 12px; align-items: center; background: rgba(0,0,0,0.1); padding: 5px 12px; border-radius: 15px; border: 1px solid var(--border-color); margin-right: auto;}
        .stat-item { display: flex; align-items: center; gap: 5px; }
        .post-excerpt { line-height: 1.8; font-size: 1rem; opacity: 0.85; }

        @media (max-width: 768px) {
            .post-cover { height: 180px; }
            .post-card-body { padding: 15px; }
            .post-title { font-size: 1.3rem; }
            .stat-icons { width: 100%; justify-content: space-between; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="header-title">Real <span>Blog</span></a>
        </div>
        <div class="actions">
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
                <svg class="icon" style="width:22px; height:22px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </header>

    <div class="main-layout">
        <div class="profile-header" id="profile-card" style="display: none;">
            <img id="author-avatar" src="" class="profile-avatar">
            <h1 class="profile-name" id="author-name">...</h1>
            <div class="profile-stats">
                <span id="author-post-count">📝 ... مطلب</span>
                <span id="author-like-count">❤️ ... لایک دریافت شده</span>
            </div>
        </div>

        <h3 style="border-bottom: 2px solid var(--border-color); padding-bottom:10px;">نوشته‌های این نویسنده</h3>
        <div id="posts-container" style="text-align: center; color: #888;">در حال دریافت مطالب...</div>
    </div>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        function toggleTheme() {
            const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const _supabase = window.supabase.createClient('https://zvajqmlqulgyqlffjbze.supabase.co', 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO');
        const urlParams = new URLSearchParams(window.location.search);
        const authorId = urlParams.get('id');

        const iconHeart = `<svg class="icon icon-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
        const iconEye = `<svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const iconComment = `<svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`;
        const iconClock = `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
        const iconCalendar = `<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;

        async function loadAuthorData() {
            if (!authorId) return document.getElementById('posts-container').innerText = 'شناسه نویسنده نامعتبر است.';

            const { data: posts, error } = await _supabase.from('posts').select('*').eq('user_id', authorId).order('created_at', { ascending: false });
            const { data: commentsData } = await _supabase.from('comments').select('post_id');
            const container = document.getElementById('posts-container');
            
            if (error || !posts || posts.length === 0) {
                container.innerText = 'هیچ مطلبی از این نویسنده یافت نشد.';
                return;
            }

            container.innerHTML = '';
            let totalLikes = 0;
            let commentCounts = {};
            if (commentsData) commentsData.forEach(c => { commentCounts[c.post_id] = (commentCounts[c.post_id] || 0) + 1; });

            // آپدیت هدر پروفایل با اطلاعات اولین پست
            document.getElementById('author-name').innerText = posts[0].author_name || 'ناشناس';
            document.getElementById('author-avatar').src = posts[0].avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${posts[0].author_name}`;
            document.getElementById('author-post-count').innerText = `📝 ${posts.length} مطلب`;
            document.getElementById('profile-card').style.display = 'block';

            posts.forEach((post, index) => {
                totalLikes += (post.likes || 0);
                const date = new Date(post.created_at).toLocaleDateString('fa-IR');
                const categoryBadge = post.category ? `<div class="category-badge">${escapeHtml(post.category)}</div>` : '';
                
                let tempDiv = document.createElement('div');
                tempDiv.innerHTML = post.content;
                let firstImg = tempDiv.querySelector('img');
                let coverHtml = firstImg ? `<img src="${firstImg.src}" class="post-cover" alt="کاور">` : '';

                let textContent = tempDiv.innerText.replace(/\s+/g, ' ').trim();
                let excerpt = textContent.substring(0, 150) + '...';
                
                const readTime = Math.max(1, Math.ceil(textContent.split(' ').length / 200));
                const readTimeDisplay = readTime <= 1 ? 'کمتر از ۱ دقیقه' : `${readTime} دقیقه`;

                container.innerHTML += `
                    <div class="post-card" style="animation-delay: ${index * 0.05}s; text-align: right;">
                        ${coverHtml}
                        <div class="post-card-body" onclick="window.location.href='post.html?id=${post.id}'">
                            <div class="post-meta">
                                <span class="stat-item">${iconCalendar} ${date}</span>
                                <span class="stat-item" style="color:var(--accent-color);">${iconClock} ${readTimeDisplay}</span>
                                <div class="stat-icons">
                                    <span class="stat-item">${iconHeart} <span style="color:#ff4c4c; font-weight:bold;">${post.likes || 0}</span></span>
                                    <span class="stat-item">${iconEye} ${post.views || 0}</span>
                                    <span class="stat-item">${iconComment} ${commentCounts[post.id] || 0}</span>
                                </div>
                            </div>
                            ${categoryBadge}
                            <h2 class="post-title">${escapeHtml(post.title)}</h2>
                            <div class="post-excerpt">${excerpt}</div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('author-like-count').innerText = `❤️ ${totalLikes} لایک دریافت شده`;
        }

        function escapeHtml(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ''; }
        loadAuthorData();
    </script>
</body>
</html>
