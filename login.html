<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به وبلاگ</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Vazirmatn', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e1e1e; padding: 35px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #2a2a2a; }
        h3 { margin-top: 0; color: #fff; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2d2d2d; border: 1px solid #3f3f3f; color: white; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #00adb5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.05rem; font-family: inherit; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #008c93; }
        #msg { font-size: 0.9rem; display: none; margin-top: 12px; }
        .back-link { display: inline-block; margin-top: 20px; color: #888; text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: #ccc; }
    </style>
</head>
<body>

    <div class="login-box">
        <h3>ورود / عضویت نویسنده</h3>
        <p style="color: #888; font-size: 0.85rem; margin-bottom: 20px;">نام یا نام مستعار خود را برای انتشار مطالب بنویسید:</p>

        <input type="text" id="username" placeholder="نام نمایشی شما..." required>
        
        <button id="submit-btn" onclick="handleAnonymousLogin()">ورود سریع به پنل</button>
        <p id="msg"></p>

        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <script>
        const supabaseUrl = 'https://zvajqmlqulgyqlffjbze.supabase.co';
        const supabaseKey = 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO';
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function handleAnonymousLogin() {
            const rawUser = document.getElementById('username').value.trim();
            const msg = document.getElementById('msg');
            const btn = document.getElementById('submit-btn');

            if (!rawUser) {
                showMessage('لطفاً نام خود را وارد کنید.', '#ff4c4c');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'در حال ایجاد نشست...';
            msg.style.display = 'none';

            const { data, error } = await _supabase.auth.signInAnonymously({
                options: {
                    data: { username: rawUser }
                }
            });

            if (error) {
                showMessage('خطا در ورود: ' + error.message, '#ff4c4c');
                btn.disabled = false;
                btn.innerText = 'ورود سریع به پنل';
            } else {
                window.location.href = 'admin.html';
            }
        }

        function showMessage(text, color) {
            const msg = document.getElementById('msg');
            msg.innerText = text;
            msg.style.color = color;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
