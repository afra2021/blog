<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود به حساب - Real Blog</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e; --border-color: #333; --accent-color: #00adb5; }
        [data-theme="light"] { --bg-color: #f4f4f9; --text-color: #333333; --card-bg: #ffffff; --border-color: #ddd; --accent-color: #007c82; }
        
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; transition: background-color 0.4s ease; }
        
        svg.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
        
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .login-container { background: var(--card-bg); padding: 40px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid var(--border-color); box-shadow: 0 10px 40px rgba(0,0,0,0.2); animation: scaleUp 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; box-sizing: border-box; text-align: center; }
        
        .logo-title { font-size: 2rem; font-weight: 900; color: var(--text-color); text-decoration: none; display: inline-block; margin-bottom: 30px; font-family: sans-serif; }
        .logo-title span { color: var(--accent-color); }
        
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #888; font-weight: bold; }
        .input-group input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: 0.3s; outline: none; }
        .input-group input:focus { border-color: var(--accent-color); box-shadow: 0 0 10px rgba(0,173,181,0.1); }
        
        button { width: 100%; padding: 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1rem; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px; }
        .btn-primary { background: var(--accent-color); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,173,181,0.3); }
        
        .btn-secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); border-color: var(--accent-color); color: var(--accent-color); }

        .back-link { display: inline-flex; align-items: center; gap: 5px; color: #888; text-decoration: none; font-size: 0.9rem; margin-top: 10px; transition: 0.3s; }
        .back-link:hover { color: var(--accent-color); }

        #toast-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast { background: var(--card-bg); color: var(--text-color); padding: 12px 20px; border-radius: 8px; border-right: 4px solid var(--accent-color); box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-family: inherit; font-size: 0.9rem; opacity: 0; transform: translateX(-50px); transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; align-items: center; gap: 10px; }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.error { border-right-color: #ff4c4c; }

        @media (max-width: 480px) {
            .login-container { width: 90%; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <a href="index.html" class="logo-title">Real <span>Blog</span></a>
        
        <form id="login-form">
            <div class="input-group">
                <label for="identifier">نام کاربری (یا ایمیل مدیر)</label>
                <input type="text" id="identifier" placeholder="نام کاربری خود را وارد کنید..." required dir="ltr">
            </div>
            
            <div class="input-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" placeholder="••••••••" required dir="ltr">
            </div>
            
            <button type="submit" class="btn-primary" id="login-btn">
                <svg class="icon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                ورود به حساب
            </button>
            
            <button type="button" class="btn-secondary" id="reg-btn" onclick="handleRegister()">
                <svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                ثبت‌نام با نام کاربری
            </button>
        </form>

        <a href="index.html" class="back-link">
            <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            بازگشت به سایت
        </a>
    </div>

    <div id="toast-container"></div>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            const icon = isError ? `<svg class="icon" style="stroke:#ff4c4c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>` : `<svg class="icon" style="stroke:var(--accent-color)" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { 
                toast.classList.remove('show'); 
                setTimeout(() => toast.remove(), 400); 
            }, 3000);
        }

        const supabaseUrl = 'https://zvajqmlqulgyqlffjbze.supabase.co';
        const supabaseKey = 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO';
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // تبدیل هوشمند نام کاربری به فرمت قابل قبول دیتابیس (اگر ایمیل نبود)
        function formatIdentifier(input) {
            let clean = input.trim().toLowerCase();
            if (clean.includes('@')) {
                return clean; // برای ادمین یا کسانی که ایمیل می‌زنند
            }
            return `${clean}@blog.local`; // ساخت ایمیل مجازی برای یوزرنیم‌ها
        }

        async function checkAlreadyLoggedIn() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                window.location.href = 'admin.html';
            }
        }
        checkAlreadyLoggedIn();

        // عملیات ورود
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawInput = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!rawInput || !password) return showToast('لطفاً نام کاربری و رمز عبور را وارد کنید.', true);

            const emailToAuth = formatIdentifier(rawInput);
            const btn = document.getElementById('login-btn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = 'در حال ورود...';
            btn.disabled = true;

            const { data, error } = await _supabase.auth.signInWithPassword({ 
                email: emailToAuth, 
                password: password 
            });

            if (error) {
                let errorMsg = 'نام کاربری یا رمز عبور اشتباه است.';
                showToast(errorMsg, true);
                btn.innerHTML = originalContent;
                btn.disabled = false;
            } else {
                showToast('خوش آمدید! در حال انتقال...');
                setTimeout(() => window.location.href = 'admin.html', 1200);
            }
        });

        // عملیات ثبت‌نام با نام کاربری
        async function handleRegister() {
            const rawInput = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!rawInput || !password) return showToast('برای ثبت‌نام، یک نام کاربری و رمز عبور وارد کنید.', true);
            if (password.length < 6) return showToast('رمز عبور باید حداقل ۶ کاراکتر باشد.', true);

            const emailToRegister = formatIdentifier(rawInput);
            const cleanUsername = rawInput.includes('@') ? rawInput.split('@')[0] : rawInput;

            const btn = document.getElementById('reg-btn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = 'در حال ساخت حساب...';
            btn.disabled = true;

            const { data, error } = await _supabase.auth.signUp({ 
                email: emailToRegister, 
                password: password,
                options: {
                    data: {
                        username: cleanUsername,
                        display_name: cleanUsername
                    }
                }
            });

            if (error) {
                let errorMsg = error.message;
                if (errorMsg.includes('User already registered')) errorMsg = 'این نام کاربری قبلاً انتخاب شده است.';
                
                showToast(errorMsg, true);
                btn.innerHTML = originalContent;
                btn.disabled = false;
            } else {
                showToast('حساب شما با موفقیت ساخته شد! اکنون وارد شوید.');
                btn.innerHTML = originalContent;
                btn.disabled = false;
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
