<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود مدیریت - وبلاگ من</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Vazirmatn', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e1e1e; padding: 40px; border-radius: 10px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2d2d2d; border: 1px solid #3f3f3f; color: white; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #00adb5; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1rem; font-family: inherit; }
        button:hover { background: #008c93; }
        #error-msg { color: #ff4c4c; font-size: 0.9rem; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ورود به پنل</h2>
        <input type="email" id="email" placeholder="ایمیل..." required>
        <input type="password" id="password" placeholder="رمز عبور..." required>
        <button onclick="login()">ورود</button>
        <p id="error-msg"></p>
    </div>

    <script>
        const supabaseUrl = 'https://zvajqmlqulgyqlffjbze.supabase.co';
        const supabaseKey = 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.style.display = 'none';

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorMsg.innerText = "ایمیل یا رمز اشتباه است!";
                errorMsg.style.display = 'block';
            } else {
                window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
