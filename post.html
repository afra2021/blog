<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خواندن مطلب - Real Blog</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e; --border-color: #333; --accent-color: #00adb5; }
        [data-theme="light"] { --bg-color: #f4f4f9; --text-color: #333333; --card-bg: #ffffff; --border-color: #ddd; --accent-color: #007c82; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; margin: 0; transition: 0.4s; padding-bottom: 50px; -webkit-tap-highlight-color: transparent; }
        
        #progress-bar { position: fixed; top: 0; left: 0; height: 4px; background: var(--accent-color); z-index: 1001; width: 0%; transition: width 0.1s; }
        
        svg.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        
        .sticky-author-bar { position: fixed; top: -70px; left: 0; width: 100%; background: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-sizing: border-box; z-index: 999; transition: top 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .sticky-author-bar.visible { top: 0; }
        .sticky-author { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .sticky-author img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .sticky-title { font-size: 0.9rem; color: #888; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
        
        .container { max-width: 800px; margin: 50px auto 20px; background: var(--card-bg); padding: 35px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .post-title { font-size: 2.2rem; color: var(--accent-color); margin-top: 0; line-height: 1.4; }
        
        .post-meta-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .post-meta { color: #888; font-size: 0.95rem; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .author-badge { display: flex; align-items: center; gap: 10px; background: rgba(0,173,181,0.1); padding: 5px 12px; border-radius: 20px; color: var(--accent-color); font-weight: bold; text-decoration: none; transition: 0.3s;}
        .author-badge:hover { background: var(--accent-color); color: white; }
        .avatar-img { width: 30px; height: 30px; border-radius: 50%; background: #222; object-fit: cover; }
        
        .stats-badge { background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 8px; font-size: 0.85rem; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 5px;}
        
        @keyframes heartBurst { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
        
        .like-btn { background: rgba(255, 76, 76, 0.1); color: #ff4c4c; border: 1px solid #ff4c4c; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-family: inherit; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; font-size: 1rem; }
        .like-btn svg.icon-heart { stroke: #ff4c4c; fill: none; transition: 0.3s; width: 18px; height: 18px; }
        .like-btn:hover { background: #ff4c4c; color: white; transform: scale(1.05); }
        .like-btn:hover svg.icon-heart { stroke: white; }
        
        .like-btn.liked { background: #ff4c4c; color: white; animation: heartBurst 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .like-btn.liked svg.icon-heart { stroke: white; fill: white; }

        .post-content { line-height: 1.9; font-size: 1.1rem; }
        .post-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; border: 1px solid var(--border-color); }
        
        .admin-controls { background: rgba(0, 173, 181, 0.05); padding: 15px; border-radius: 8px; border: 1px dashed var(--accent-color); margin-bottom: 25px; display: none; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .btn-action { display: flex; align-items: center; gap: 6px; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: inherit; color: white; }
        .btn-delete { background: #ff4c4c; } .btn-delete:hover { background: #e00000; }
        .btn-edit { background: var(--accent-color); } .btn-edit:hover { opacity: 0.8; }
        .btn-hide { background: #f39c12; } .btn-hide:hover { opacity: 0.9; }
        .btn-cancel { background: #555; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; } .btn-cancel:hover { background: #444; }

        .hidden-alert-banner { background: rgba(255, 76, 76, 0.15); border: 1px solid #ff4c4c; color: #ff4c4c; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; display: none; align-items: center; gap: 8px; font-size: 0.9rem; }

        .comments-section { margin-top: 50px; padding-top: 20px; border-top: 2px dashed var(--border-color); }
        .comment-box { display: flex; gap: 15px; background: var(--bg-color); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .comment-avatar { width: 45px; height: 45px; border-radius: 50%; background: #222; flex-shrink: 0; object-fit: cover; }
        .comment-content { flex: 1; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; color: var(--accent-color); flex-wrap: wrap; gap: 10px; }
        .comment-text { font-size: 0.95rem; line-height: 1.6; margin: 0; color: var(--text-color); }
        
        .add-comment { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        textarea { width: 100%; padding: 12px; border-radius: 8px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); font-family: inherit; resize: vertical; min-height: 80px; box-sizing: border-box; }
        .btn-submit-comment { background: var(--accent-color); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; width: 150px; transition: 0.3s;}
        
        #toast-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast { background: var(--card-bg); color: var(--text-color); padding: 12px 20px; border-radius: 8px; border-right: 4px solid var(--accent-color); box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-family: inherit; font-size: 0.9rem; opacity: 0; transform: translateX(-50px); transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; align-items: center; gap: 10px; }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.error { border-right-color: #ff4c4c; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-box { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--border-color); text-align: center; transform: scale(0.9); transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-msg { margin: 0 0 20px 0; font-size: 1.1rem; line-height: 1.6; color: var(--text-color); }
        .modal-actions { display: flex; justify-content: center; gap: 10px; }

        @media (max-width: 768px) {
            .container { margin: 20px 10px; padding: 20px 15px; }
            .post-title { font-size: 1.6rem; }
            .post-meta-container { flex-direction: column; align-items: flex-start; gap: 15px; }
            .like-btn { width: 100%; justify-content: center; }
            .admin-controls { flex-direction: column; align-items: stretch; text-align: center; gap: 15px; }
            .admin-controls div { display: flex; flex-direction: column; width: 100%; gap: 10px; }
            .btn-action { justify-content: center; }
            .sticky-author-bar { padding: 10px 15px; }
            .btn-submit-comment { width: 100%; }
        }
        @media (min-width: 768px) { .sticky-title { display: block; } }
    </style>
</head>
<body>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <p class="modal-msg" id="modal-msg">آیا مطمئن هستید؟</p>
            <div class="modal-actions">
                <button id="modal-yes" class="btn-action btn-delete">بله، مطمئنم</button>
                <button id="modal-no" class="btn-cancel">لغو</button>
            </div>
        </div>
    </div>
    
    <div id="toast-container"></div>
    <div id="progress-bar"></div>
    
    <div class="sticky-author-bar" id="sticky-bar">
        <div class="sticky-author" id="sticky-author-info"></div>
        <div class="sticky-title" id="sticky-title">...</div>
        <button id="sticky-like-btn" class="like-btn" onclick="toggleLike()">
            <svg class="icon icon-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <span id="sticky-like-count">0</span>
        </button>
    </div>

    <div class="container">
        <a href="index.html" style="color: #888; text-decoration: none; display: flex; align-items:center; gap:5px; margin-bottom: 20px; transition: 0.2s;">
            <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> بازگشت به صفحه اصلی
        </a>
        
        <div id="hidden-banner" class="hidden-alert-banner">
            👁️‍🗨️ این مطلب در حال حاضر مخفی است و فقط شما (ادمین) می‌توانید آن را ببینید.
        </div>

        <div id="admin-panel" class="admin-controls">
            <span style="color: var(--accent-color); font-weight: bold;">پنل مدیریت مطلب</span>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <!-- دکمه مخفی‌سازی ویژه ادمین کل -->
                <button id="toggle-hide-btn" class="btn-action btn-hide" style="display:none;" onclick="toggleHidePost()">
                    👁️‍🗨️ مخفی کردن
                </button>
                <button class="btn-action btn-edit" onclick="editThisPost()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> ویرایش
                </button>
                <button class="btn-action btn-delete" onclick="deleteThisPost()">
                    <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> حذف
                </button>
            </div>
        </div>

        <h1 class="post-title" id="p-title">در حال بارگذاری...</h1>
        
        <div id="post-body-wrapper">
            <div class="post-meta-container" id="main-meta-container">
                <div class="post-meta">
                    <a href="#" id="p-author" class="author-badge">...</a>
                    <span class="stats-badge" id="p-readtime">...</span>
                    <span class="stats-badge" id="p-views">...</span>
                </div>
                <button id="like-btn" class="like-btn" onclick="toggleLike()">
                    <svg class="icon icon-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span id="like-count">0</span>
                </button>
            </div>

            <div class="post-content" id="p-content"></div>

            <div class="comments-section" id="comments-anchor">
                <h3 style="display:flex; align-items:center; gap:8px;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    نظرات کاربران <span id="comment-count-display" style="color:var(--accent-color); font-size:0.9rem;"></span>
                </h3>
                <div id="comments-list">در حال بارگذاری نظرات...</div>

                <div class="add-comment" id="comment-form" style="display: none;">
                    <textarea id="new-comment-text" placeholder="نظر خود را بنویسید..."></textarea>
                    <button class="btn-submit-comment" onclick="addComment()">ارسال نظر</button>
                </div>
                <p id="login-msg" style="color: #888; font-size: 0.9rem;">برای ثبت نظر باید <a href="login.html" style="color: var(--accent-color);">وارد شوید</a>.</p>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            const icon = isError ? `<svg class="icon" style="stroke:#ff4c4c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>` : `<svg class="icon" style="stroke:var(--accent-color)" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        function showConfirm(message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-modal');
                document.getElementById('modal-msg').innerText = message;
                modal.classList.add('show');
                
                document.getElementById('modal-yes').onclick = function() {
                    modal.classList.remove('show');
                    resolve(true);
                };
                document.getElementById('modal-no').onclick = function() {
                    modal.classList.remove('show');
                    resolve(false);
                };
            });
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
            
            const metaContainer = document.getElementById('main-meta-container');
            const stickyBar = document.getElementById('sticky-bar');
            if(metaContainer) {
                if(winScroll > metaContainer.offsetTop + 100) stickyBar.classList.add('visible');
                else stickyBar.classList.remove('visible');
            }
        };

        const _supabase = window.supabase.createClient('https://zvajqmlqulgyqlffjbze.supabase.co', 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO');
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const ADMIN_EMAIL = 'behnamafra1387@gmail.com';
        
        let currentUser = null; let currentUsername = ''; let currentAvatar = '';
        let isAdmin = false; 
        let isPostHidden = false;
        
        let currentLikes = 0; let hasLiked = false;
        let likedUsersArray = []; let viewedUsersArray = [];

        const iconClock = `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
        const iconEye = `<svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;

        async function initPage() {
            if (!postId) {
                document.getElementById('p-title').innerText = 'پست پیدا نشد!';
                return showToast('شناسه مطلب نامعتبر است', true);
            }
            
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                currentUsername = currentUser.user_metadata?.display_name || currentUser.user_metadata?.username;
                if(!currentUsername) currentUsername = currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'مدیر سایت' : currentUser.email.split('@')[0];
                currentAvatar = currentUser.user_metadata?.avatar_url || '';
                
                document.getElementById('comment-form').style.display = 'flex';
                document.getElementById('login-msg').style.display = 'none';
                if (currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) isAdmin = true;
            }

            await loadPost();
            loadComments();
        }

        async function loadPost() {
            const { data, error } = await _supabase.from('posts').select('*').eq('id', postId).single();
            if (error || !data) {
                document.getElementById('p-title').innerText = 'خطا در بارگذاری مطلب';
                document.getElementById('post-body-wrapper').style.display = 'none';
                return showToast('مطلب یافت نشد یا پاک شده است', true);
            }

            // قفل دسترسی برای پست‌های مخفی
            isPostHidden = Boolean(data.is_hidden);
            if (isPostHidden && !isAdmin) {
                document.getElementById('p-title').innerText = '🔒 این مطلب توسط مدیر سایت به صورت موقت مخفی شده است.';
                document.getElementById('post-body-wrapper').style.display = 'none';
                return;
            }

            updateHideUI();

            viewedUsersArray = (data.viewed_users && data.viewed_users.trim() !== '') ? data.viewed_users.split(',') : [];
            likedUsersArray = (data.liked_users && data.liked_users.trim() !== '') ? data.liked_users.split(',') : [];
            let newViews = data.views || 0;

            if (currentUser && !viewedUsersArray.includes(currentUser.id)) {
                viewedUsersArray.push(currentUser.id);
                newViews++;
                await _supabase.from('posts').update({ views: newViews, viewed_users: viewedUsersArray.join(',') }).eq('id', postId);
            }

            const author = data.author_name || 'ناشناس';
            const avatarUrl = data.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${author}`;
            
            currentLikes = data.likes || 0;
            hasLiked = currentUser && likedUsersArray.includes(currentUser.id);

            document.getElementById('p-title').innerText = data.title;
            document.getElementById('sticky-title').innerText = data.title;
            
            const authorHTML = `<img src="${avatarUrl}" class="avatar-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${author}'"> ${escapeHtml(author)}`;
            document.getElementById('p-author').innerHTML = authorHTML;
            document.getElementById('p-author').href = `author.html?id=${data.user_id}`;
            document.getElementById('sticky-author-info').innerHTML = authorHTML;
            
            let tempDiv = document.createElement('div');
            tempDiv.innerHTML = data.content;
            let textContent = tempDiv.innerText.replace(/\s+/g, ' ').trim();
            const readTime = Math.max(1, Math.ceil(textContent.split(' ').length / 200));
            const readTimeDisplay = readTime <= 1 ? 'کمتر از ۱ دقیقه' : `${readTime} دقیقه`;

            document.getElementById('p-readtime').innerHTML = `${iconClock} ${readTimeDisplay}`;
            document.getElementById('p-views').innerHTML = `${iconEye} ${newViews}`;
            document.getElementById('p-content').innerHTML = data.content;
            
            updateLikeUI();

            if (currentUser && (isAdmin || currentUser.id === data.user_id)) {
                document.getElementById('admin-panel').style.display = 'flex';
                if (isAdmin) {
                    document.getElementById('toggle-hide-btn').style.display = 'flex';
                }
            }
        }

        function updateHideUI() {
            const banner = document.getElementById('hidden-banner');
            const hideBtn = document.getElementById('toggle-hide-btn');
            if (isPostHidden) {
                banner.style.display = 'flex';
                hideBtn.innerHTML = '👁️ نمایش عمومی';
                hideBtn.style.background = '#2ecc71';
            } else {
                banner.style.display = 'none';
                hideBtn.innerHTML = '👁️‍🗨️ مخفی کردن موقت';
                hideBtn.style.background = '#f39c12';
            }
        }

        async function toggleHidePost() {
            if (!isAdmin) return;
            const newStatus = !isPostHidden;
            const { error } = await _supabase.from('posts').update({ is_hidden: newStatus }).eq('id', postId);
            
            if (error) {
                showToast('خطا در تغییر وضعیت نمایش: ' + error.message, true);
            } else {
                isPostHidden = newStatus;
                updateHideUI();
                showToast(isPostHidden ? 'مطلب مخفی شد (فقط قابل رویت برای شما)' : 'مطلب دوباره برای همه قابل نمایش شد!');
            }
        }

        function updateLikeUI() {
            document.getElementById('like-count').innerText = currentLikes;
            document.getElementById('sticky-like-count').innerText = currentLikes;
            const btn1 = document.getElementById('like-btn');
            const btn2 = document.getElementById('sticky-like-btn');
            if (hasLiked) {
                btn1.classList.add('liked'); btn2.classList.add('liked');
            } else {
                btn1.classList.remove('liked'); btn2.classList.remove('liked');
            }
        }

        async function toggleLike() {
            if (!currentUser) return showToast('برای لایک کردن باید وارد سایت شوید.', true);

            if (hasLiked) { 
                currentLikes--; 
                likedUsersArray = likedUsersArray.filter(id => id !== currentUser.id);
                hasLiked = false; 
            } else { 
                currentLikes++; 
                likedUsersArray.push(currentUser.id);
                hasLiked = true; 
            }
            updateLikeUI();
            
            const { error: likeError } = await _supabase.from('posts').update({ 
                likes: currentLikes, liked_users: likedUsersArray.join(',')
            }).eq('id', postId);
            
            if (likeError) {
                if (hasLiked) { currentLikes--; hasLiked = false; likedUsersArray.pop(); } 
                else { currentLikes++; hasLiked = true; likedUsersArray.push(currentUser.id); }
                updateLikeUI();
                showToast('خطا در ارتباط با سرور', true);
            }
        }

        async function loadComments() {
            const { data: comments, error } = await _supabase.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
            const listDiv = document.getElementById('comments-list');
            const countDisplay = document.getElementById('comment-count-display');
            
            if (error) return listDiv.innerHTML = 'خطا در دریافت نظرات.';
            countDisplay.innerText = `(${comments ? comments.length : 0})`;
            
            if (!comments || comments.length === 0) return listDiv.innerHTML = '<p style="color:#888; font-size:0.9rem;">هنوز نظری ثبت نشده است.</p>';

            listDiv.innerHTML = '';
            comments.forEach(c => {
                const date = new Date(c.created_at).toLocaleDateString('fa-IR');
                const author = c.author_name || 'ناشناس';
                const avatarUrl = c.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${author}`;
                const deleteBtn = isAdmin ? `<button class="btn-action btn-delete" style="padding:4px 8px; font-size:0.8rem;" onclick="deleteComment('${c.id}')"><svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> حذف</button>` : '';
                
                listDiv.innerHTML += `
                    <div class="comment-box">
                        <img src="${avatarUrl}" class="comment-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${author}'">
                        <div class="comment-content">
                            <div class="comment-header"><span><b>${escapeHtml(author)}</b> - ${date}</span>${deleteBtn}</div>
                            <p class="comment-text">${escapeHtml(c.content)}</p>
                        </div>
                    </div>`;
            });
        }

        async function addComment() {
            const text = document.getElementById('new-comment-text').value.trim();
            if (!text) return showToast('لطفاً متن نظر را وارد کنید.', true);

            const { error } = await _supabase.from('comments').insert([{ 
                post_id: postId, author_name: currentUsername, avatar_url: currentAvatar, content: text 
            }]);

            if (!error) { 
                document.getElementById('new-comment-text').value = ''; 
                showToast('نظر شما با موفقیت ثبت شد!');
                loadComments(); 
            } else {
                showToast('خطا در ثبت نظر', true);
            }
        }

        async function deleteComment(commentId) {
            if(await showConfirm('آیا از حذف این کامنت مطمئن هستید؟')) {
                const { error } = await _supabase.from('comments').delete().eq('id', commentId);
                if (!error) {
                    showToast('کامنت با موفقیت حذف شد.');
                    loadComments();
                } else {
                    showToast('خطا در حذف کامنت', true);
                }
            }
        }

        function editThisPost() { window.location.href = `admin.html?edit=${postId}`; }
        
        async function deleteThisPost() {
            if(await showConfirm('آیا از حذف کامل این مطلب مطمئن هستید؟ (این عملیات غیرقابل بازگشت است)')) {
                const { error } = await _supabase.from('posts').delete().eq('id', postId);
                if(!error) {
                    window.location.href = 'index.html';
                } else {
                    showToast('خطا در حذف مطلب', true);
                }
            }
        }
        
        function escapeHtml(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ''; }
        
        initPage();
    </script>
</body>
</html>
