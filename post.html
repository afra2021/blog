<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خواندن مطلب - Real Blog</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e;
            --border-color: #333; --accent-color: #00adb5;
        }
        [data-theme="light"] {
            --bg-color: #f4f4f9; --text-color: #333333; --card-bg: #ffffff;
            --border-color: #ddd; --accent-color: #007c82;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 20px; transition: 0.4s; }
        .container { max-width: 800px; margin: 20px auto; background: var(--card-bg); padding: 35px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        
        .post-title { font-size: 2.2rem; color: var(--accent-color); margin-top: 0; }
        .post-meta { color: #888; font-size: 0.95rem; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); display: flex; gap: 20px; }
        .post-content { line-height: 1.9; font-size: 1.1rem; }
        .post-content img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
        
        .admin-controls { background: rgba(255, 76, 76, 0.1); padding: 15px; border-radius: 8px; border: 1px solid #ff4c4c; margin-bottom: 25px; display: none; justify-content: space-between; align-items: center; }
        .btn-delete { background: #ff4c4c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .btn-delete:hover { background: #d43f3f; }

        /* بخش کامنت‌ها */
        .comments-section { margin-top: 50px; padding-top: 20px; border-top: 2px dashed var(--border-color); }
        .comment-box { background: var(--bg-color); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; color: var(--accent-color); }
        .comment-text { font-size: 0.95rem; line-height: 1.6; margin: 0; }
        
        .add-comment { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        textarea { width: 100%; padding: 12px; border-radius: 8px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); font-family: inherit; resize: vertical; min-height: 80px; box-sizing: border-box; }
        .btn-submit-comment { background: var(--accent-color); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; width: 150px; }
        
        .delete-comment-btn { color: #ff4c4c; background: none; border: none; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
        .delete-comment-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" style="color: #888; text-decoration: none; display: inline-block; margin-bottom: 20px;">← بازگشت به صفحه اصلی</a>
        
        <div id="admin-panel" class="admin-controls">
            <span style="color: #ff4c4c; font-weight: bold;">دسترسی مدیریت</span>
            <button class="btn-delete" onclick="deleteThisPost()">حذف کامل این پست</button>
        </div>

        <h1 class="post-title" id="p-title">در حال بارگذاری...</h1>
        <div class="post-meta">
            <span id="p-author">✍️ ...</span>
            <span id="p-cat">📁 ...</span>
        </div>
        <div class="post-content" id="p-content"></div>

        <!-- بخش نظرات -->
        <div class="comments-section">
            <h3>نظرات کاربران</h3>
            <div id="comments-list">در حال بارگذاری نظرات...</div>

            <div class="add-comment" id="comment-form" style="display: none;">
                <textarea id="new-comment-text" placeholder="نظر خود را بنویسید..."></textarea>
                <button class="btn-submit-comment" onclick="addComment()">ارسال نظر</button>
            </div>
            <p id="login-msg" style="color: #888; font-size: 0.9rem;">برای ثبت نظر باید <a href="login.html" style="color: var(--accent-color);">وارد شوید</a>.</p>
        </div>
    </div>

    <script>
        // همگام‌سازی تم
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const _supabase = window.supabase.createClient('https://zvajqmlqulgyqlffjbze.supabase.co', 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO');
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const ADMIN_EMAIL = 'behnamafra1387@gmail.com';
        
        let currentUser = null;
        let currentUsername = '';
        let isAdmin = false;

        async function initPage() {
            if (!postId) return document.getElementById('p-title').innerText = 'پست پیدا نشد!';
            
            // بررسی لاگین و ادمین بودن
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                currentUsername = currentUser.user_metadata?.username || 'کاربر';
                document.getElementById('comment-form').style.display = 'flex';
                document.getElementById('login-msg').style.display = 'none';
                
                if (currentUser.email === ADMIN_EMAIL) {
                    isAdmin = true;
                    document.getElementById('admin-panel').style.display = 'flex';
                }
            }

            loadPost();
            loadComments();
        }

        async function loadPost() {
            const { data, error } = await _supabase.from('posts').select('*').eq('id', postId).single();
            if (error || !data) return document.getElementById('p-title').innerText = 'خطا در بارگذاری مطلب';

            document.getElementById('p-title').innerText = data.title;
            document.getElementById('p-author').innerHTML = `✍️ ${data.author_name || 'ناشناس'}`;
            document.getElementById('p-cat').innerHTML = data.category ? `📁 ${data.category}` : '📁 بدون دسته';
            document.getElementById('p-content').innerHTML = data.content;
        }

        async function loadComments() {
            const { data: comments, error } = await _supabase.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
            const listDiv = document.getElementById('comments-list');
            
            if (error) return listDiv.innerHTML = 'خطا در دریافت نظرات.';
            if (!comments || comments.length === 0) return listDiv.innerHTML = '<p style="color:#888; font-size:0.9rem;">هنوز نظری ثبت نشده است.</p>';

            listDiv.innerHTML = '';
            comments.forEach(c => {
                const date = new Date(c.created_at).toLocaleDateString('fa-IR');
                // اگر ادمین باشد، دکمه حذف کنار کامنت ظاهر می‌شود
                const deleteBtn = isAdmin ? `<button class="delete-comment-btn" onclick="deleteComment(${c.id})">حذف 🗑️</button>` : '';
                
                listDiv.innerHTML += `
                    <div class="comment-box">
                        <div class="comment-header">
                            <span><b>${escapeHtml(c.author_name)}</b> - ${date}</span>
                            ${deleteBtn}
                        </div>
                        <p class="comment-text">${escapeHtml(c.content)}</p>
                    </div>
                `;
            });
        }

        async function addComment() {
            const text = document.getElementById('new-comment-text').value.trim();
            if (!text) return alert('لطفاً متن نظر را وارد کنید.');

            const { error } = await _supabase.from('comments').insert([{ 
                post_id: postId, author_name: currentUsername, content: text 
            }]);

            if (error) alert('خطا در ثبت نظر: ' + error.message);
            else {
                document.getElementById('new-comment-text').value = '';
                loadComments();
            }
        }

        async function deleteThisPost() {
            if(confirm('این مطلب برای همیشه حذف شود؟')) {
                await _supabase.from('posts').delete().eq('id', postId);
                window.location.href = 'index.html';
            }
        }

        async function deleteComment(commentId) {
            if(confirm('آیا از حذف این کامنت مطمئن هستید؟')) {
                await _supabase.from('comments').delete().eq('id', commentId);
                loadComments();
            }
        }

        function escapeHtml(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ''; }

        initPage();
    </script>
</body>
</html>
