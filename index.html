<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Blog</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e;
            --border-color: #333; --accent-color: #00adb5; --header-bg: rgba(26, 26, 26, 0.95);
        }
        [data-theme="light"] {
            --bg-color: #f4f4f9; --text-color: #333333; --card-bg: #ffffff;
            --border-color: #ddd; --accent-color: #007c82; --header-bg: rgba(255, 255, 255, 0.95);
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; margin: 0; transition: 0.4s ease; }
        
        header { background-color: var(--header-bg); padding: 15px 30px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px); }
        .header-title { font-size: 1.6rem; font-weight: 900; color: var(--text-color); text-decoration: none; font-family: sans-serif; }
        .header-title span { color: var(--accent-color); }
        
        .actions { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .auth-box { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--border-color); font-size: 0.9rem; }
        .auth-avatar { width: 28px; height: 28px; border-radius: 50%; background: #333; }
        
        .theme-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: 0.3s; padding: 0; }
        .theme-toggle:hover { transform: rotate(20deg) scale(1.15); }
        .admin-btn { background: linear-gradient(45deg, var(--accent-color), #006b70); color: white; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: all 0.3s ease; }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,173,181,0.4); }

        .main-layout { display: flex; gap: 30px; max-width: 1100px; margin: 40px auto; padding: 0 20px; align-items: flex-start; }
        .sidebar { width: 30%; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); position: sticky; top: 90px; }
        .sidebar h3 { margin-top: 0; font-size: 1.1rem; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; }
        .content { width: 70%; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .post-card { background: var(--card-bg); padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border-color); cursor: pointer; opacity: 0; animation: fadeInUp 0.5s ease forwards; transition: transform 0.3s, border-color 0.3s; }
        .post-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        
        .category-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; background: #333; color: white; margin-bottom: 10px; }
        .post-title { margin: 0 0 10px 0; font-size: 1.5rem; color: var(--accent-color); }
        .post-meta { font-size: 0.85rem; color: #888; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; }
        .author-info { display: flex; align-items: center; gap: 8px; }
        .post-avatar { width: 24px; height: 24px; border-radius: 50%; background: #222; }
        
        #loading { text-align: center; color: #888; font-size: 1.1rem; }
        
        /* دکمه رفتن به بالا */
        #scroll-top-btn { position: fixed; bottom: 30px; right: 30px; background: var(--accent-color); color: white; width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; z-index: 1000; }
        #scroll-top-btn:hover { background: #008c93; transform: translateY(-3px); }
        
        @media (max-width: 768px) { .main-layout { flex-direction: column; } .sidebar, .content { width: 100%; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="header-title">Real <span>Blog</span></a>
        <div class="actions">
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
            <div id="auth-status"></div>
            <a href="login.html" class="admin-btn">پنل انتشار</a>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <h3>📌 مطالب مدیر سایت</h3>
            <div id="admin-posts">در حال دریافت...</div>
        </aside>

        <main class="content">
            <div id="loading">در حال دریافت مطالب...</div>
            <div id="posts-container"></div>
        </main>
    </div>

    <button id="scroll-top-btn" onclick="scrollToTop()">↑</button>

    <script>
        const themeBtn = document.getElementById('theme-btn');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeBtn.innerText = savedTheme === 'dark' ? '☀️' : '🌙';

        function toggleTheme() {
            const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeBtn.innerText = newTheme === 'dark' ? '☀️' : '🌙';
        }

        // نمایش دکمه اسکرول
        window.onscroll = function() {
            const scrollBtn = document.getElementById('scroll-top-btn');
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) scrollBtn.style.display = "block";
            else scrollBtn.style.display = "none";
        };
        function scrollToTop() { window.scrollTo({top: 0, behavior: 'smooth'}); }

        const supabaseUrl = 'https://zvajqmlqulgyqlffjbze.supabase.co';
        const supabaseKey = 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO';
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        const ADMIN_EMAIL = 'behnamafra1387@gmail.com';

        // بررسی لاگین بودن کاربر برای نمایش در هدر
        async function checkUserStatus() {
            const { data: { session } } = await _supabase.auth.getSession();
            const authDiv = document.getElementById('auth-status');
            if (session) {
                let name = session.user.user_metadata?.display_name || session.user.user_metadata?.username;
                if (!name) name = session.user.email === ADMIN_EMAIL ? 'مدیر سایت' : 'کاربر';
                const avatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`;
                authDiv.innerHTML = `<div class="auth-box"><img src="${avatar}" class="auth-avatar"> <span>${name}</span></div>`;
            }
        }
        checkUserStatus();

        async function loadPosts() {
            const { data: posts, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('posts-container');
            const adminContainer = document.getElementById('admin-posts');
            const loading = document.getElementById('loading');

            if (error || !posts) return loading.innerText = 'خطا در دریافت مطالب.';
            loading.style.display = 'none';
            container.innerHTML = ''; adminContainer.innerHTML = '';

            let adminPostCount = 0;

            posts.forEach((post, index) => {
                const date = new Date(post.created_at).toLocaleDateString('fa-IR');
                const author = post.author_name || 'ناشناس';
                const avatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${author}`;
                const category = post.category ? `<div class="category-badge">${escapeHtml(post.category)}</div>` : '';
                
                let tempDiv = document.createElement('div');
                tempDiv.innerHTML = post.content;
                let excerpt = (tempDiv.textContent || tempDiv.innerText).substring(0, 150) + '...';

                const cardHTML = `
                    <div class="post-card ${post.author_email === ADMIN_EMAIL ? 'admin-pin' : ''}" 
                         style="animation-delay: ${index * 0.1}s;" 
                         onclick="window.location.href='post.html?id=${post.id}'">
                        ${category}
                        <h2 class="post-title">${escapeHtml(post.title)}</h2>
                        <div class="post-meta">
                            <span class="author-info"><img src="${avatar}" class="post-avatar"> ${escapeHtml(author)}</span>
                            <span>📅 ${date}</span>
                        </div>
                        <div class="post-excerpt">${excerpt}</div>
                    </div>
                `;

                container.innerHTML += cardHTML;
                if (post.author_email === ADMIN_EMAIL || post.author_name === 'مدیر سایت') {
                    adminContainer.innerHTML += cardHTML;
                    adminPostCount++;
                }
            });

            if(adminPostCount === 0) adminContainer.innerHTML = '<p style="font-size:0.85rem; color:#888;">مطلبی از مدیر وجود ندارد.</p>';
        }

        function escapeHtml(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ''; }
        loadPosts();
    </script>
</body>
</html>
