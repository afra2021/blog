<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Blog</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e; --border-color: #333; --accent-color: #00adb5; }
        [data-theme="light"] { --bg-color: #f4f4f9; --text-color: #333333; --card-bg: #ffffff; --border-color: #ddd; --accent-color: #007c82; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Vazirmatn', sans-serif; margin: 0; transition: 0.4s ease; }
        
        header { background-color: var(--bg-color); padding: 15px 30px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.4s; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-title { font-size: 1.6rem; font-weight: 900; color: var(--text-color); text-decoration: none; font-family: sans-serif; }
        .header-title span { color: var(--accent-color); }
        
        .live-clock { font-size: 0.9rem; color: var(--accent-color); background: var(--card-bg); padding: 6px 15px; border-radius: 15px; border: 1px solid var(--border-color); direction: rtl; font-family: 'Vazirmatn', sans-serif; font-weight: bold; }
        
        .actions { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .auth-box { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--border-color); font-size: 0.9rem; font-weight: bold; }
        .auth-avatar { width: 28px; height: 28px; border-radius: 50%; background: #333; object-fit: cover; }
        
        .theme-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: 0.3s; padding: 0; }
        .theme-toggle:hover { transform: rotate(20deg) scale(1.15); }
        .admin-btn { background: linear-gradient(45deg, var(--accent-color), #006b70); color: white; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: all 0.3s ease; }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,173,181,0.4); }

        .main-layout { display: block; max-width: 850px; margin: 40px auto; padding: 0 20px; }
        .content { width: 100%; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .post-card { background: var(--card-bg); padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border-color); opacity: 0; animation: fadeInUp 0.4s ease forwards; transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s ease, box-shadow 0.3s ease; }
        .post-card:hover { transform: translateY(-6px); border-color: var(--accent-color); box-shadow: 0 8px 25px rgba(0, 173, 181, 0.12); }
        .post-card-content { cursor: pointer; }
        
        .category-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; background: #333; color: white; margin-bottom: 10px; }
        .post-title { margin: 0 0 10px 0; font-size: 1.5rem; color: var(--accent-color); }
        
        .post-meta { font-size: 0.85rem; color: #888; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; z-index: 2; position: relative; }
        .author-info { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; padding: 4px 10px; border-radius: 20px; transition: 0.3s; }
        .author-info:hover { background: rgba(0, 173, 181, 0.1); color: var(--accent-color); }
        .post-avatar { width: 24px; height: 24px; border-radius: 50%; background: #222; object-fit: cover; }
        
        .stat-icons { display: flex; gap: 12px; align-items: center; background: rgba(0,0,0,0.1); padding: 4px 12px; border-radius: 15px; }
        .post-excerpt { line-height: 1.8; font-size: 1rem; opacity: 0.9; }
        
        #loading { text-align: center; color: #888; font-size: 1.1rem; }
        #scroll-top-btn { position: fixed; bottom: 30px; right: 30px; background: var(--accent-color); color: white; width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; z-index: 1000; }
        #scroll-top-btn:hover { background: #008c93; transform: translateY(-3px); }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="header-title">Real <span>Blog</span></a>
            <div id="live-clock" class="live-clock">در حال دریافت زمان...</div>
        </div>
        <div class="actions">
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
            <div id="auth-status"></div>
            <a href="login.html" class="admin-btn">پنل مدیریت</a>
        </div>
    </header>

    <div class="main-layout">
        <main class="content">
            <div id="loading">در حال دریافت مطالب...</div>
            <div id="posts-container"></div>
        </main>
    </div>

    <button id="scroll-top-btn" onclick="scrollToTop()">↑</button>

    <script>
        function updateClock() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('live-clock').innerText = `${dateStr} - ساعت ${timeStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const themeBtn = document.getElementById('theme-btn');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeBtn.innerText = savedTheme === 'dark' ? '☀️' : '🌙';

        function toggleTheme() {
            const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeBtn.innerText = newTheme === 'dark' ? '☀️' : '🌙';
        }

        window.onscroll = function() {
            const scrollBtn = document.getElementById('scroll-top-btn');
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) scrollBtn.style.display = "block";
            else scrollBtn.style.display = "none";
        };
        function scrollToTop() { window.scrollTo({top: 0, behavior: 'smooth'}); }

        // وقتی با دکمه بک مرورگر برمی‌گردیم، اطلاعات جدید را لود کند تا بازدیدها سینک شوند
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) { loadPosts(); }
        });

        const supabaseUrl = 'https://zvajqmlqulgyqlffjbze.supabase.co';
        const supabaseKey = 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO';
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        const ADMIN_EMAIL = 'behnamafra1387@gmail.com';

        async function checkUserStatus() {
            const { data: { session } } = await _supabase.auth.getSession();
            const authDiv = document.getElementById('auth-status');
            if (session) {
                let name = session.user.user_metadata?.display_name || session.user.user_metadata?.username;
                if (!name) name = session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'مدیر سایت' : session.user.email.split('@')[0];
                let avatar = session.user.user_metadata?.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`;
                authDiv.innerHTML = `<div class="auth-box"><img src="${avatar}" class="auth-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${name}'"> <span>${name}</span></div>`;
            }
        }
        checkUserStatus();

        async function loadPosts() {
            const { data: posts, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
            const { data: commentsData } = await _supabase.from('comments').select('post_id');
            
            const container = document.getElementById('posts-container');
            const loading = document.getElementById('loading');

            if (error || !posts) return loading.innerText = 'خطا در دریافت مطالب.';
            loading.style.display = 'none';
            container.innerHTML = ''; 

            let commentCounts = {};
            if (commentsData) {
                commentsData.forEach(c => { commentCounts[c.post_id] = (commentCounts[c.post_id] || 0) + 1; });
            }

            posts.forEach((post, index) => {
                const date = new Date(post.created_at).toLocaleDateString('fa-IR');
                const author = post.author_name || 'ناشناس';
                const avatarUrl = post.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${author}`;
                const category = post.category ? `<div class="category-badge">${escapeHtml(post.category)}</div>` : '';
                const likes = post.likes || 0;
                const views = post.views || 0;
                const comments = commentCounts[post.id] || 0;
                
                let tempDiv = document.createElement('div');
                tempDiv.innerHTML = post.content;
                let textContent = tempDiv.innerText.replace(/\s+/g, ' ').trim();
                let excerpt = textContent.substring(0, 150) + '...';
                
                const wordCount = textContent.split(' ').length;
                const readTime = Math.ceil(wordCount / 200);
                const readTimeDisplay = readTime <= 1 ? 'کمتر از ۱ دقیقه' : `${readTime} دقیقه`;

                const cardHTML = `
                    <div class="post-card" style="animation-delay: ${index * 0.05}s;">
                        <div class="post-meta">
                            <a href="author.html?id=${post.user_id}" class="author-info">
                                <img src="${avatarUrl}" class="post-avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${author}'"> 
                                ${escapeHtml(author)}
                            </a>
                            <span>📅 ${date}</span>
                            <span style="color:var(--accent-color);">⏱️ ${readTimeDisplay}</span>
                            <div class="stat-icons">
                                <span>❤️ ${likes}</span>
                                <span>👁️ ${views}</span>
                                <span>💬 ${comments}</span>
                            </div>
                        </div>
                        <div class="post-card-content" onclick="window.location.href='post.html?id=${post.id}'">
                            ${category}
                            <h2 class="post-title">${escapeHtml(post.title)}</h2>
                            <div class="post-excerpt">${excerpt}</div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function escapeHtml(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ''; }
        loadPosts();
    </script>
</body>
</html>
