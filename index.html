<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وبلاگ شخصی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; min-height: 90vh; }
        .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; justify-content: space-between; }
        header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 20px; }
        h1 { margin: 0 0 10px 0; color: #ffffff; }
        header p { color: #888; margin: 0; font-size: 0.95rem; }
        .post-card { background: #1e1e1e; padding: 25px; border-radius: 12px; margin-bottom: 20px; text-decoration: none; color: inherit; display: block; border: 1px solid #262626; transition: border-color 0.2s; }
        .post-card:hover { border-color: #00adb5; }
        .post-date { color: #00adb5; font-size: 0.85rem; margin-bottom: 8px; }
        .post-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .post-preview { color: #aaa; font-size: 0.95rem; line-height: 1.6; margin: 0; }
        #loading { text-align: center; color: #666; }
        
        /* استایل فوتر و دکمه مخفی مدیریت */
        footer { text-align: center; margin-top: 50px; padding-top: 20px; border-top: 1px solid #1a1a1a; color: #444; font-size: 0.8rem; }
        .secret-link { color: #444; text-decoration: none; cursor: default; }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <header>
                <h1>وبلاگ شخصی</h1>
                <p>اینجا محلیه برای نوشتن افکار، نظرات و تجربیاتم.</p>
            </header>

            <main id="posts-container">
                <div id="loading">در حال دریافت پست‌ها...</div>
            </main>
        </div>

        <footer>
            تمامی حقوق محفوظ است <a href="admin.html" class="secret-link">©</a> ۲۰۲۶
        </footer>
    </div>

    <script>
        const supabaseUrl = 'https://zvajqmlqulgyqlffjbze.supabase.co';
        const supabaseKey = 'sb_publishable_KGX0MtqTo2_1AzqKens_iQ_0MUN7ojO';
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function stripHtml(html) {
            const tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        async function loadFeed() {
            const container = document.getElementById('posts-container');
            const { data: posts, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '<p style="text-align:center; color:#cf6679;">خطا در دریافت پست‌ها!</p>';
                return;
            }

            if (!posts || posts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">هنوز پستی منتشر نشده است.</p>';
                return;
            }

            container.innerHTML = '';
            posts.forEach(post => {
                const date = new Date(post.created_at).toLocaleDateString('fa-IR');
                const cleanText = stripHtml(post.content);
                const preview = cleanText.length > 120 ? cleanText.substring(0, 120) + '...' : (cleanText || 'مشاهده تصویر و مطلب...');

                container.innerHTML += `
                    <a href="post.html?id=${post.id}" class="post-card">
                        <div class="post-date">${date}</div>
                        <div class="post-title">${post.title}</div>
                        <p class="post-preview">${preview}</p>
                    </a>
                `;
            });
        }

        loadFeed();
    </script>
</body>
</html>
